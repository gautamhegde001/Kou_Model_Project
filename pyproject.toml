[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "kou_model"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "sqlalchemy",
    "yfinance",
]

[tool.scikit-build]
wheel.packages = ["pkgs"]
cmake.version = ">=3.15"